[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shardac"
dynamic = ["version"]
description = "Open-weight models for detecting cheats in Minecraft: Java Edition"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shard" }]
keywords = ["minecraft", "anticheat", "onnx", "transformer", "time-series"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.21", "onnxruntime>=1.15"]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.20"]
pandas = ["pandas>=1.3"]
test = ["pytest>=7", "pandas>=1.3"]

[project.urls]
Homepage = "https://shard.ac"
Source = "https://github.com/kaelusai/shardac"
"Model card" = "https://huggingface.co/kaelusai/shard-2-nano"
Methodology = "https://shard.ac/methodology/shard-2"

[tool.hatch.version]
path = "src/shard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CONTRACT.md", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
